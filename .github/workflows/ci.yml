name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # CI 里**不调真实模型**：
  #   - 零成本，不需要在仓库里配 API Key 的 secret
  #   - mock 模式走的是同一套循环代码（工具调用、消息拼装、终止条件），
  #     所以路径覆盖不打折，而且结果确定、不会 flaky
  LLM_MODE: mock
  DB_HOST: 127.0.0.1
  DB_PORT: "3306"
  DB_USER: root
  DB_PASSWORD: root
  LOG_FORMAT: json

jobs:
  # ============================================================
  # 测试 + 端到端冒烟
  # ============================================================
  test:
    name: 测试与冒烟
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 初始化数据库
        run: python scripts/bootstrap.py --wait 90

      # ------------------------------------------------------------
      # ★ 必须先跑一遍流水线，库才算「就绪」。
      #
      # seed_data.py 把 200 件商品全灌成 status=0（待审核），这是为了
      # 演示「从待审核开始跑审核」的完整闭环。但有两处依赖「已审核」状态：
      #
      #   1. 检索工具只搜 status IN (1,5) 的商品
      #      → 全新库上一条都搜不到
      #   2. 部分测试断言参照物带驳回规则，那要 item_audit 里有记录
      #      → 全新库里是空的
      #
      # 开发机上一直是「已审核」状态（手动跑过很多次），所以本地全绿；
      # 换任何一台干净机器/新库，这 4 个检索测试必然失败。
      # **这个环境依赖是 CI 从空库建起才暴露的。**
      #
      # 在这里跑一遍（mock 模式，约 1 秒）既让库达到正确状态，
      # 又顺带验证了「初始化 → 投递 → 消费 → 落库」这条主链路。
      # ------------------------------------------------------------
      - name: 跑一遍流水线，让库达到「已审核」状态
        run: |
          set -e
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8100 \
            --log-level warning > /tmp/api.log 2>&1 &
          echo "等待 API 就绪 ..."
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8100/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8100/health > /dev/null || { cat /tmp/api.log; exit 1; }

          echo "投递全部待审核商品 ..."
          curl -sf -X POST http://127.0.0.1:8100/audits/batch \
            -H 'Content-Type: application/json' -d '{"status":0,"limit":2000}'
          echo

          echo "消费队列 ..."
          python -u worker.py --drain --quiet

          echo "流水线后的库状态："
          python -c "
          import pymysql
          from pymysql.cursors import DictCursor
          from app.config import BIZ_DB, META_DB, DB_CONFIG
          cfg = {k: v for k, v in DB_CONFIG.items() if k != 'database'}
          c = pymysql.connect(database=BIZ_DB, cursorclass=DictCursor, **cfg)
          cur = c.cursor()
          cur.execute('SELECT status, COUNT(*) n FROM item GROUP BY status ORDER BY status')
          print('  item.status 分布:', cur.fetchall())
          cur.execute('SELECT COUNT(*) n FROM item_audit')
          print('  item_audit 行数:', cur.fetchone()['n'])
          c.close()
          "

      - name: 跑测试套件
        run: python -m pytest tests/ -q

      - name: 端到端冒烟
        run: |
          set -e
          # API 由上一步用 nohup 起着；这里只需要一个 worker
          curl -sf http://127.0.0.1:8100/health > /dev/null \
            || { echo "API 掉了"; cat /tmp/api.log; exit 1; }
          nohup python -u worker.py --interval 0.3 --quiet > /tmp/worker.log 2>&1 &
          sleep 5
          python scripts/smoke.py --base-url http://127.0.0.1:8100

      - name: 失败时打印服务日志
        if: failure()
        run: |
          echo "======== API 日志 ========"
          cat /tmp/api.log || true
          echo "======== worker 日志 ========"
          cat /tmp/worker.log || true
          echo "======== 队列状态 ========"
          python -c "
          import pymysql
          from pymysql.cursors import DictCursor
          from app.config import META_DB, DB_CONFIG
          cfg = {k: v for k, v in DB_CONFIG.items() if k != 'database'}
          c = pymysql.connect(database=META_DB, cursorclass=DictCursor, **cfg)
          cur = c.cursor()
          cur.execute('SELECT status, COUNT(*) n FROM audit_jobs GROUP BY status')
          print(cur.fetchall())
          cur.execute('SELECT id, item_id, error FROM audit_jobs WHERE status=\"failed\" LIMIT 5')
          print(cur.fetchall())
          c.close()
          "

  # ============================================================
  # 镜像能构建 —— 这是面试官拿到项目后做的第一件事，
  # 所以必须由 CI 保证它一直是好的
  # ============================================================
  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: audit-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验 compose 配置合法
        run: docker compose config --quiet
